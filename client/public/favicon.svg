<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1316" />
      <stop offset="100%" stop-color="#060809" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2DD4BF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#2DD4BF" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Outer Glow Group -->
  <g filter="url(#glow)">
    <!-- Email Envelope -->
    <rect x="11" y="20" width="42" height="28" rx="6" fill="#0D2E2B" stroke="url(#tealGrad)" stroke-width="2.75" />
    
    <!-- Envelope Flap Crease -->
    <path d="M12.5 22.5 L32 36 L51.5 22.5" stroke="url(#tealGrad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Interior Fold Accents -->
    <path d="M13 46 L24.5 34.5" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M51 46 L39.5 34.5" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- AI Sparkle Icon (Top Right Corner) -->
  <path d="M47 5 C47 10.5 49.5 13 55 13 C49.5 13 47 15.5 47 21 C47 15.5 44.5 13 39 13 C44.5 13 47 10.5 47 5 Z" fill="url(#sparkleGrad)" />

  <!-- Subtle Accent Dot (Bottom Left) -->
  <circle cx="16" cy="14" r="2" fill="#2DD4BF" fill-opacity="0.7" />
</svg>
